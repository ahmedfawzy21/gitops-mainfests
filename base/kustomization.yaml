---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: movies-app

resources:
  - namespace.yaml
  - configmap.yaml
  - jenkins-rbac.yaml
  - movies-loader-rollout.yaml
  - movies-parser-rollout.yaml
  - movies-store-rollout.yaml
  - movies-marketplace-rollout.yaml
  - movies-marketplace-ingress.yaml

# Labels on every resource's metadata only. Not on selectors: kustomize adds
# selector labels to Services but cannot reach the Rollout CRD's pod template,
# so the blue/green Services would select labels the pods never get
# (Rollout InvalidSpec "unmatch label").
labels:
  - pairs:
      app.kubernetes.io/part-of: movies-app
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
