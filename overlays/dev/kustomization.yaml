---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: movies-app

resources:
  - ../../base

# Dev-specific patches
patches:
  # Reduce replicas for dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Rollout
  # Only movies-loader is deployed through GitOps so far. The other three have
  # no current image in ECR (dev-latest does not exist, and ECR expires images
  # after 14 days) and movies-store needs MONGO_URI (docs/known-gaps.md, gap 5),
  # so they stay at 0 replicas until their pipelines deploy. Remove a service's
  # entry here when its Jenkinsfile sets deploy: true.
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Rollout
      name: movies-parser|movies-store|movies-marketplace

# Dev-specific images (will be overwritten by ArgoCD Image Updater)
images:
  - name: movies-loader-image
    newName: 724921088099.dkr.ecr.eu-north-1.amazonaws.com/movies-loader
    newTag: repo-hygiene-6ee49c3-1
  - name: movies-parser-image
    newName: 724921088099.dkr.ecr.eu-north-1.amazonaws.com/movies-parser
    newTag: dev-latest
  - name: movies-store-image
    newName: 724921088099.dkr.ecr.eu-north-1.amazonaws.com/movies-store
    newTag: dev-latest
  - name: movies-marketplace-image
    newName: 724921088099.dkr.ecr.eu-north-1.amazonaws.com/movies-marketplace
    newTag: dev-latest

# Labels on every resource's metadata only. Not on selectors: kustomize adds
# selector labels to Services but cannot reach the Rollout CRD's pod template,
# so the blue/green Services would select labels the pods never get
# (Rollout InvalidSpec "unmatch label").
labels:
  - pairs:
      environment: dev
    includeSelectors: false
